<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="neuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="neuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#neuraGrad)"/>

  <!-- Glowing Orbs -->
  <circle cx="180" cy="180" r="130" fill="#a855f7" opacity="0.12" filter="url(#neuraGlow)"/>
  <circle cx="450" cy="120" r="100" fill="#ec4899" opacity="0.1" filter="url(#neuraGlow)"/>

  <!-- Neural Mesh / Network Nodes -->
  <g stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5">
    <line x1="120" y1="120" x2="220" y2="80" />
    <line x1="220" y1="80" x2="320" y2="130" />
    <line x1="120" y1="120" x2="160" y2="220" />
    <line x1="160" y1="220" x2="280" y2="240" />
    <line x1="320" y1="130" x2="280" y2="240" />
    <line x1="320" y1="130" x2="420" y2="90" />
    <line x1="280" y1="240" x2="380" y2="260" />
    <line x1="420" y1="90" x2="480" y2="180" />
    <line x1="380" y1="260" x2="480" y2="180" />
    <line x1="420" y1="90" x2="380" y2="260" />
  </g>

  <!-- Neural Nodes -->
  <circle cx="120" cy="120" r="7" fill="#a855f7" filter="url(#neuraGlow)" />
  <circle cx="220" cy="80" r="9" fill="#c084fc" filter="url(#neuraGlow)" />
  <circle cx="320" cy="130" r="12" fill="#ec4899" filter="url(#neuraGlow)" />
  <circle cx="160" cy="220" r="6" fill="#a855f7" />
  <circle cx="280" cy="240" r="8" fill="#818cf8" />
  <circle cx="420" cy="90" r="8" fill="#ec4899" />
  <circle cx="380" cy="260" r="10" fill="#a855f7" filter="url(#neuraGlow)" />
  <circle cx="480" cy="180" r="7" fill="#f472b6" />

  <!-- Center Biometric Keystroke Dynamics Visual -->
  <g transform="translate(190, 80)">
    <rect width="220" height="140" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <text x="20" y="30" fill="#e9d5ff" font-family="sans-serif" font-weight="bold" font-size="12">BEHAVIORAL TELEMETRY</text>
    <text x="20" y="46" fill="#a855f7" font-family="monospace" font-size="9">Keystroke Latency · Flight Time</text>
    
    <!-- Mini Histogram / Distribution Curve -->
    <path d="M20 110 Q50 60 70 85 T110 50 T150 95 T195 110" fill="none" stroke="#c084fc" stroke-width="2.5" filter="url(#neuraGlow)"/>
    <line x1="20" y1="110" x2="200" y2="110" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Trust Score -->
    <rect x="20" y="118" width="85" height="15" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="25" y="129" fill="#34d399" font-family="monospace" font-size="8">TRUST: 99.4%</text>

    <!-- Threat Shield Indicator -->
    <rect x="115" y="118" width="85" height="15" rx="3" fill="rgba(168, 85, 247, 0.2)"/>
    <text x="120" y="129" fill="#c084fc" font-family="monospace" font-size="8">BOT DEFENSE: ON</text>
  </g>

  <!-- Floating Lock & Key Shield -->
  <g transform="translate(60, 240)">
    <rect width="130" height="60" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
    <text x="12" y="25" fill="#f472b6" font-family="sans-serif" font-weight="bold" font-size="10">ANOMALY ENGINE</text>
    <text x="12" y="45" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="9">0 Breaches Detected</text>
  </g>
</svg>
