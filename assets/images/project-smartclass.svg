<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="smartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b36" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0a192f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="smartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#smartGrad)"/>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="120" r="110" fill="#06b6d4" opacity="0.12" filter="url(#smartGlow)"/>
  <circle cx="450" cy="240" r="100" fill="#10b981" opacity="0.1" filter="url(#smartGlow)"/>

  <!-- Circuit traces in background -->
  <g stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.5" fill="none">
    <path d="M50 80 H 160 L 200 120 V 220 L 240 260 H 320" />
    <path d="M100 280 H 180 L 220 240 V 160 L 260 120 H 380" />
    <path d="M420 80 H 500 L 530 110 V 250" />
    <circle cx="50" cy="80" r="3" fill="#06b6d4"/>
    <circle cx="320" cy="260" r="3" fill="#06b6d4"/>
    <circle cx="100" cy="280" r="3" fill="#10b981"/>
    <circle cx="380" cy="120" r="3" fill="#10b981"/>
    <circle cx="530" cy="250" r="3" fill="#06b6d4"/>
  </g>

  <!-- Central ESP32 Microcontroller Board Mockup -->
  <g transform="translate(190, 60)">
    <!-- PCB Board -->
    <rect width="220" height="230" rx="12" fill="#062e2d" stroke="#06b6d4" stroke-width="2" filter="url(#smartGlow)"/>
    
    <!-- Microcontroller Chip -->
    <rect x="45" y="45" width="130" height="110" rx="8" fill="#111827" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <text x="75" y="85" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="14">ESP32</text>
    <text x="65" y="105" fill="#38bdf8" font-family="sans-serif" font-size="9">Dual-Core IoT MCU</text>
    <text x="82" y="125" fill="#34d399" font-family="monospace" font-size="8">Wi-Fi + BLE</text>

    <!-- Chip Pins -->
    <g fill="#06b6d4">
      <rect x="37" y="55" width="8" height="4" rx="1"/>
      <rect x="37" y="65" width="8" height="4" rx="1"/>
      <rect x="37" y="75" width="8" height="4" rx="1"/>
      <rect x="37" y="85" width="8" height="4" rx="1"/>
      <rect x="37" y="95" width="8" height="4" rx="1"/>
      <rect x="37" y="105" width="8" height="4" rx="1"/>
      <rect x="37" y="115" width="8" height="4" rx="1"/>
      <rect x="37" y="125" width="8" height="4" rx="1"/>

      <rect x="175" y="55" width="8" height="4" rx="1"/>
      <rect x="175" y="65" width="8" height="4" rx="1"/>
      <rect x="175" y="75" width="8" height="4" rx="1"/>
      <rect x="175" y="85" width="8" height="4" rx="1"/>
      <rect x="175" y="95" width="8" height="4" rx="1"/>
      <rect x="175" y="105" width="8" height="4" rx="1"/>
      <rect x="175" y="115" width="8" height="4" rx="1"/>
      <rect x="175" y="125" width="8" height="4" rx="1"/>
    </g>

    <!-- Status LEDs -->
    <circle cx="65" cy="190" r="5" fill="#ef4444" filter="url(#smartGlow)"/>
    <text x="75" y="193" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">PWR</text>

    <circle cx="120" cy="190" r="5" fill="#10b981" filter="url(#smartGlow)"/>
    <text x="130" y="193" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">SYNC</text>

    <circle cx="170" cy="190" r="5" fill="#38bdf8" filter="url(#smartGlow)"/>
    <text x="180" y="193" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">PIR</text>
  </g>

  <!-- Left Telemetry Card -->
  <g transform="translate(30, 160)">
    <rect width="135" height="110" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <text x="15" y="25" fill="#06b6d4" font-family="sans-serif" font-weight="bold" font-size="10">ROOM SENSORS</text>
    <text x="15" y="48" fill="#ffffff" font-family="monospace" font-size="11">PIR: OCCUPIED</text>
    <text x="15" y="68" fill="#34d399" font-family="monospace" font-size="10">TEMP: 24.2 °C</text>
    <text x="15" y="88" fill="#fbbf24" font-family="monospace" font-size="10">LUX: 340 lm</text>
  </g>

  <!-- Right Efficiency Card -->
  <g transform="translate(435, 90)">
    <rect width="135" height="95" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="15" y="25" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="10">ENERGY SAVED</text>
    <text x="15" y="55" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="22">38.4%</text>
    <text x="15" y="78" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="9">Auto HVAC & Lights</text>
  </g>
</svg>
