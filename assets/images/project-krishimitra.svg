<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="krishiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="krishiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#krishiGrad)"/>

  <!-- Glowing Orbs -->
  <circle cx="150" cy="180" r="120" fill="#22c55e" opacity="0.12" filter="url(#krishiGlow)"/>
  <circle cx="450" cy="150" r="100" fill="#eab308" opacity="0.1" filter="url(#krishiGlow)"/>

  <!-- Scanning Line Grid -->
  <g stroke="rgba(34, 197, 94, 0.15)" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Central Camera Scanner Frame with Leaf & Bounding Box -->
  <g transform="translate(190, 55)">
    <!-- Smartphone / Scanner Viewfinder -->
    <rect width="220" height="250" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="2"/>
    
    <!-- Top Scanner UI -->
    <text x="25" y="30" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="10">AI CROP VISION</text>
    <circle cx="195" cy="26" r="4" fill="#22c55e" filter="url(#krishiGlow)"/>

    <!-- Plant Leaf Illustration -->
    <path d="M110 70 C70 90 60 140 75 180 C90 220 110 230 110 230 C110 230 130 220 145 180 C160 140 150 90 110 70 Z" 
          fill="#16a34a" opacity="0.85" filter="url(#krishiGlow)"/>
    <path d="M110 70 L110 230 M110 110 L85 130 M110 140 L135 160 M110 170 L90 190 M110 195 L130 210" 
          stroke="#4ade80" stroke-width="2" fill="none"/>

    <!-- AI Bounding Box & Target Reticle -->
    <rect x="55" y="80" width="110" height="130" rx="6" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="55" y="80" width="90" height="18" fill="#eab308"/>
    <text x="60" y="93" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="9">Early Blight (98%)</text>
    
    <!-- Laser Scan Bar -->
    <line x1="50" y1="140" x2="170" y2="140" stroke="#22c55e" stroke-width="2" filter="url(#krishiGlow)"/>
  </g>

  <!-- Left Weather / Soil Sensor Card -->
  <g transform="translate(35, 140)">
    <rect width="135" height="120" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
    <text x="14" y="24" fill="#22c55e" font-family="sans-serif" font-weight="bold" font-size="10">SOIL TELEMETRY</text>
    <text x="14" y="46" fill="#ffffff" font-family="monospace" font-size="10">Moisture: 68%</text>
    <text x="14" y="66" fill="#38bdf8" font-family="monospace" font-size="10">pH Value: 6.5</text>
    <text x="14" y="86" fill="#facc15" font-family="monospace" font-size="10">NPK: Optimal</text>
    <text x="14" y="106" fill="#4ade80" font-family="sans-serif" font-size="9">✓ Good for Sowing</text>
  </g>

  <!-- Right Agro Advisory Card -->
  <g transform="translate(435, 160)">
    <rect width="135" height="100" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(234, 179, 8, 0.3)" stroke-width="1"/>
    <text x="14" y="25" fill="#eab308" font-family="sans-serif" font-weight="bold" font-size="10">AI ADVISORY</text>
    <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="10">Organic Spray</text>
    <text x="14" y="64" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="9">Neem oil treatment</text>
    <text x="14" y="85" fill="#34d399" font-family="monospace" font-size="9">Yield saved: ~25%</text>
  </g>
</svg>
