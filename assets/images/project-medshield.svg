<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="medAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="medGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#medGrad)"/>

  <!-- Glowing Orbs -->
  <circle cx="150" cy="100" r="120" fill="#10b981" opacity="0.12" filter="url(#medGlow)"/>
  <circle cx="480" cy="260" r="100" fill="#06b6d4" opacity="0.1" filter="url(#medGlow)"/>

  <!-- Medical Grid & Wave Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
  </g>

  <!-- Central Shield & Heartbeat ECG Visual -->
  <g transform="translate(180, 50)">
    <!-- Security Shield Contour -->
    <path d="M120 20 L220 55 L220 150 C220 210 120 255 120 255 C120 255 20 210 20 150 L20 55 Z" 
          fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2"/>
    
    <!-- Inner Shield -->
    <path d="M120 38 L200 68 L200 145 C200 195 120 235 120 235 C120 235 40 195 40 145 L40 68 Z" 
          fill="rgba(6, 182, 212, 0.05)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>

    <!-- Glowing Medical Cross -->
    <g transform="translate(95, 75)">
      <rect x="18" y="5" width="14" height="42" rx="4" fill="#10b981" filter="url(#medGlow)"/>
      <rect x="4" y="19" width="42" height="14" rx="4" fill="#10b981" filter="url(#medGlow)"/>
    </g>

    <!-- Lock Icon in shield center -->
    <circle cx="120" cy="180" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <path d="M115 174 C115 171 117 169 120 169 C123 169 125 171 125 174 L125 178 L115 178 Z" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="120" cy="180" r="2" fill="#06b6d4"/>
  </g>

  <!-- Floating ECG Telemetry Card -->
  <g transform="translate(40, 180)">
    <rect width="160" height="90" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="15" y="25" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="10" font-weight="bold">ECG TELEMETRY</text>
    <path d="M15 60 L45 60 L55 35 L65 75 L75 50 L85 60 L145 60" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="78" fill="#34d399" font-family="monospace" font-size="9">72 BPM · NORMAL</text>
  </g>

  <!-- Floating Patient Access Card -->
  <g transform="translate(390, 100)">
    <rect width="170" height="95" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <circle cx="30" cy="35" r="15" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1"/>
    <path d="M26 31 A4 4 0 1 1 34 31 A4 4 0 1 1 26 31 M22 43 A8 8 0 0 1 38 43" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="55" y="30" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Emergency Pass</text>
    <text x="55" y="44" fill="#06b6d4" font-family="monospace" font-size="9">EHR AUTH: ACTIVE</text>
    <rect x="15" y="62" width="140" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="25" y="74" fill="#34d399" font-family="monospace" font-size="8">AES-256 ZERO KNOWLEDGE</text>
  </g>
</svg>
