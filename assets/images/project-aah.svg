<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="aahGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="aahAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="aahGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="600" height="360" rx="16" fill="url(#aahGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Glowing Orb -->
  <circle cx="480" cy="80" r="100" fill="#38bdf8" opacity="0.12" filter="url(#aahGlow)"/>
  <circle cx="120" cy="280" r="90" fill="#818cf8" opacity="0.12" filter="url(#aahGlow)"/>

  <!-- Main Glass Dashboard Card Mockup -->
  <g transform="translate(60, 45)">
    <!-- Browser window chrome -->
    <rect width="480" height="270" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    
    <!-- Title bar -->
    <rect width="480" height="36" rx="12" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="20" cy="18" r="4" fill="#ef4444" />
    <circle cx="34" cy="18" r="4" fill="#f59e0b" />
    <circle cx="48" cy="18" r="4" fill="#10b981" />
    <text x="75" y="22" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">academic-admin-hub.local/portal</text>
    
    <!-- Sidebar -->
    <rect x="0" y="36" width="100" height="234" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <rect x="15" y="55" width="70" height="10" rx="3" fill="rgba(56, 189, 248, 0.3)" />
    <rect x="15" y="75" width="55" height="8" rx="2" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="15" y="93" width="65" height="8" rx="2" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="15" y="111" width="50" height="8" rx="2" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="15" y="129" width="60" height="8" rx="2" fill="rgba(255, 255, 255, 0.15)" />

    <!-- Dashboard Content -->
    <!-- Stat 1 -->
    <rect x="115" y="50" width="105" height="55" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="125" y="70" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="9">Active Students</text>
    <text x="125" y="93" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="18">1,480+</text>

    <!-- Stat 2 -->
    <rect x="230" y="50" width="105" height="55" rx="6" fill="rgba(129, 140, 248, 0.08)" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
    <text x="240" y="70" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="9">Faculty Staff</text>
    <text x="240" y="93" fill="#818cf8" font-family="sans-serif" font-weight="bold" font-size="18">120+</text>

    <!-- Stat 3 -->
    <rect x="345" y="50" width="120" height="55" rx="6" fill="rgba(52, 211, 153, 0.08)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1"/>
    <text x="355" y="70" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="9">Attendance Rate</text>
    <text x="355" y="93" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="18">94.8%</text>

    <!-- Main Chart / Table Mock -->
    <rect x="115" y="118" width="350" height="135" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="130" y="140" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-weight="600" font-size="11">Department Academic Performance Overview</text>
    
    <!-- Chart bars -->
    <rect x="130" y="195" width="28" height="42" rx="3" fill="#38bdf8" opacity="0.85"/>
    <rect x="175" y="180" width="28" height="57" rx="3" fill="#818cf8" opacity="0.85"/>
    <rect x="220" y="165" width="28" height="72" rx="3" fill="#34d399" opacity="0.85"/>
    <rect x="265" y="175" width="28" height="62" rx="3" fill="#f472b6" opacity="0.85"/>
    <rect x="310" y="160" width="28" height="77" rx="3" fill="#fbbf24" opacity="0.85"/>
    <rect x="355" y="185" width="28" height="52" rx="3" fill="#a78bfa" opacity="0.85"/>
    <rect x="400" y="170" width="28" height="67" rx="3" fill="#38bdf8" opacity="0.85"/>

    <!-- Bottom baseline -->
    <line x1="125" y1="240" x2="450" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- Graduation Cap Badge Floating -->
  <g transform="translate(480, 240)" filter="url(#aahGlow)">
    <circle cx="28" cy="28" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M28 16 L42 23 L28 30 L14 23 Z" fill="#38bdf8" />
    <path d="M20 26.5 L20 33 C20 35 24 37 28 37 C32 37 36 35 36 33 L36 26.5" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M40 24 L40 33" stroke="#818cf8" stroke-width="1.5"/>
  </g>
</svg>
